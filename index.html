<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expense Tracker</title>
<link rel="icon" href="icons/favicon.svg?v=1" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png?v=1" sizes="32x32" type="image/png">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<link rel="stylesheet" href="style.css?v=20">
<link rel="stylesheet" href="motion.css?v=4">
</head>
<body>
  <div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="shell">
    <main id="view" class="view" aria-live="polite"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <span class="tab-ind" aria-hidden="true"></span>
    <div id="tabBtns"></div>
  </nav>

  <div id="modal-root"></div>
  <div id="holo-root"></div>

  <noscript><p style="padding:24px;text-align:center">This app needs JavaScript enabled.</p></noscript>

  <script src="cards.js?v=5"></script>
  <script src="ui.js?v=3"></script>
  <script src="holo.js?v=2"></script>
  <script src="deck.js?v=4"></script>
  <script src="app.js?v=20"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="firebase-sync.js?v=7" defer></script>

  <!-- keep an installed/cached copy in step with the deployed build:
       if the server's HTML references newer ?v= assets than the ones loaded here,
       reload once (cache-busted). One attempt per session so it can never loop. -->
  <script>
  (function () {
    var KEY = "et-auto-update";
    function assets(doc) {
      return Array.prototype.slice
        .call(doc.querySelectorAll('link[rel="stylesheet"][href],script[src]'))
        .map(function (el) { return el.getAttribute("href") || el.getAttribute("src"); })
        .filter(function (u) { return u && u.indexOf("?v=") > -1; });
    }
    function check() {
      fetch(location.pathname + "?probe=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (html) {
          if (!html) return;
          var stale = assets(document).some(function (u) { return html.indexOf(u) === -1; });
          if (!stale) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }
          try { if (sessionStorage.getItem(KEY)) return; } catch (e) {}
          if (document.querySelector(".modal-backdrop")) return;   /* never yank an open form */
          var ae = document.activeElement;                          /* or an in-flight edit */
          if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          location.replace(location.pathname + "?u=" + Date.now());
        })
        .catch(function () {});
    }
    setTimeout(check, 1200);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) setTimeout(check, 400);
    });
  })();
  </script>
</body>
</html>
